<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Attendance – Rotaract Club</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      background: #f0f4f8;
      color: #1a2b4a;
      min-height: 100vh;
      padding: 24px 16px 60px;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper { max-width: 720px; margin: 0 auto; }

    /* Banner */
    .banner {
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      border-radius: 16px 16px 0 0;
      padding: 32px 32px 24px;
      text-align: center;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .banner::after {
      content: '';
      position: absolute;
      top: -30%; right: -20%;
      width: 260px; height: 260px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .banner-logo {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      position: relative; z-index: 1;
    }
    .banner-logo svg {
      width: 32px; height: 32px; stroke: #fff; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .banner h1 {
      font-size: 1.3rem; font-weight: 800; margin-bottom: 6px;
      position: relative; z-index: 1;
    }
    .banner p {
      font-size: 0.85rem; opacity: 0.85; position: relative; z-index: 1;
    }

    /* Info Card */
    .info-card {
      background: #fff; padding: 24px 28px;
      border-left: 4px solid #2563eb;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .info-item { display: flex; align-items: flex-start; gap: 10px; }
    .info-icon {
      width: 34px; height: 34px; flex-shrink: 0;
      background: #eff6ff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .info-icon svg {
      width: 16px; height: 16px; stroke: #2563eb; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .info-label {
      font-size: 0.65rem; font-weight: 700; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px;
    }
    .info-value { font-size: 0.86rem; font-weight: 600; color: #1a2b4a; }

    /* Agenda */
    .agenda-strip {
      background: #eff6ff; padding: 16px 28px;
      border-left: 4px solid #93c5fd;
    }
    .agenda-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .agenda-header svg {
      width: 15px; height: 15px; stroke: #1e40af; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .agenda-header span {
      font-size: 0.74rem; font-weight: 700; color: #1e40af;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .agenda-strip ol { padding-left: 20px; }
    .agenda-strip li {
      font-size: 0.83rem; color: #374151;
      margin-bottom: 5px; line-height: 1.5;
    }

    /* Form Card */
    .form-card {
      background: #fff; padding: 28px;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .form-title {
      font-size: 1rem; font-weight: 700; color: #1a2b4a;
      margin-bottom: 22px;
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid #f3f4f6;
    }
    .form-title svg {
      width: 20px; height: 20px; stroke: #2563eb; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* Fields */
    .field-group { margin-bottom: 18px; }
    .field-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 700; color: #374151;
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 7px;
    }
    .field-label svg {
      width: 13px; height: 13px; stroke: #6b7280; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .field-label .req { color: #ef4444; margin-left: 1px; }
    .field-input {
      width: 100%; padding: 12px 14px;
      border: 2px solid #e5e7eb; border-radius: 10px;
      font-size: 0.88rem; color: #1a2b4a;
      background: #f9fafb; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
      -webkit-appearance: none;
    }
    .field-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
      background: #fff;
    }
    .field-input::placeholder { color: #9ca3af; }

    /* E-Signature Upload Area */
    .esign-upload-wrap {
      border: 2px dashed #d1d5db;
      border-radius: 12px;
      padding: 32px 20px;
      background: #f9fafb;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .esign-upload-wrap:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .esign-upload-wrap.has-file {
      border-color: #16a34a;
      background: #f0fdf4;
      padding: 16px 20px;
    }
    .esign-upload-input {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0; cursor: pointer; z-index: 2;
    }
    .esign-upload-icon svg {
      width: 40px; height: 40px; stroke: #9ca3af; fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      margin-bottom: 10px;
    }
    .esign-upload-wrap.has-file .esign-upload-icon svg { stroke: #16a34a; }
    .esign-upload-title {
      font-size: 0.88rem; font-weight: 600; color: #374151;
      margin-bottom: 4px;
    }
    .esign-upload-wrap.has-file .esign-upload-title { color: #16a34a; }
    .esign-upload-hint {
      font-size: 0.75rem; color: #9ca3af;
    }
    .esign-preview-wrap {
      display: none; margin-top: 12px;
      border-radius: 10px; overflow: hidden;
      border: 2px solid #e5e7eb;
      background: #fff;
    }
    .esign-preview-wrap img {
      display: block; width: 100%;
      max-height: 180px; object-fit: contain;
      padding: 8px;
    }
    .esign-change-btn {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 8px; padding: 5px 14px;
      background: none; border: 1px solid #d1d5db;
      border-radius: 6px; font-size: 0.75rem;
      font-weight: 600; color: #6b7280;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }
    .esign-change-btn:hover { background: #f3f4f6; }
    .esign-change-btn svg {
      width: 13px; height: 13px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* Two-col */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 520px) { .two-col { grid-template-columns: 1fr; } }

    /* Submit Button */
    .btn-submit {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; width: 100%; padding: 15px;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      color: #fff; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 24px; letter-spacing: 0.02em;
      box-shadow: 0 4px 16px rgba(37,99,235,0.28);
      transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
    }
    .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled {
      opacity: 0.55; cursor: not-allowed; transform: none;
    }
    .btn-submit svg {
      width: 20px; height: 20px; stroke: currentColor; fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    /* Spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alerts */
    .alert {
      display: none; padding: 14px 18px; border-radius: 10px;
      font-size: 0.87rem; margin-top: 16px; line-height: 1.5;
    }
    .alert-row {
      display: flex; align-items: flex-start; gap: 10px;
    }
    .alert-row svg {
      width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .alert-error {
      background: #fef2f2; color: #991b1b;
      border: 1.5px solid #fecaca;
    }
    .alert-success {
      background: #f0fdf4; color: #166534;
      border: 1.5px solid #bbf7d0;
    }

    /* State Card */
    .state-card {
      background: #fff; padding: 56px 32px;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      text-align: center;
    }
    .state-icon {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .state-icon.info    { background: #eff6ff; }
    .state-icon.info    svg { stroke: #2563eb; }
    .state-icon.error   { background: #fef2f2; }
    .state-icon.error   svg { stroke: #dc2626; }
    .state-icon.success { background: #f0fdf4; }
    .state-icon.success svg { stroke: #16a34a; }
    .state-icon svg {
      width: 36px; height: 36px; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .state-title {
      font-size: 1.15rem; font-weight: 700; color: #1a2b4a; margin-bottom: 8px;
    }
    .state-msg {
      font-size: 0.88rem; color: #6b7280;
      line-height: 1.6; max-width: 400px; margin: 0 auto;
    }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%;
      border-radius: 8px;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Footer */
    .footer {
      text-align: center; margin-top: 24px;
      font-size: 0.72rem; color: #9ca3af;
      display: flex; align-items: center;
      justify-content: center; gap: 6px;
    }
    .footer svg {
      width: 12px; height: 12px; stroke: #9ca3af; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* Progress bar */
    .upload-progress {
      display: none; margin-top: 10px;
      height: 4px; background: #e5e7eb; border-radius: 99px; overflow: hidden;
    }
    .upload-progress-bar {
      height: 100%; background: #2563eb; border-radius: 99px;
      transition: width 0.3s ease;
      width: 0%;
    }
  </style>
</head>

</div>

/* ================================================================
   HELPERS
   ================================================================ */
function safe(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '—';
  try {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  } catch (_) { return d; }
}

function fmtTime(t) {
  if (!t) return '—';
  try {
    var p = t.split(':').map(Number);
    var h = p[0], m = p[1];
    return (h % 12 || 12) + ':' + String(m).padStart(2,'0') +
           (h >= 12 ? ' PM' : ' AM');
  } catch (_) { return t; }
}

/* ── Core Supabase REST fetch ── */
async function sbFetch(path, opts) {
  opts         = opts || {};
  opts.headers = Object.assign({
    'apikey'        : SUPABASE_KEY,
    'Authorization' : 'Bearer ' + SUPABASE_KEY,
    'Content-Type'  : 'application/json',
    'Accept'        : 'application/json'
  }, opts.headers || {});

  var url = path.startsWith('http') ? path : SUPABASE_URL + path;
  var res = await fetch(url, opts);
  return res;
}

/* ================================================================
   STATE SCREENS
   ================================================================ */
function showState(type, title, msg) {
  var iconMap = {
    error  : IC.alertCircle,
    success: IC.check,
    info   : IC.alert
  };
  document.getElementById('page-content').innerHTML =
    '<div class="state-card">' +
      '<div class="state-icon ' + type + '">' +
        (iconMap[type] || IC.alert) +
      '</div>' +
      '<div class="state-title">' + title + '</div>' +
      '<div class="state-msg">'  + msg   + '</div>' +
    '</div>';
}

/* ================================================================
   SELECTED ESIGN FILE (module-level)
   ================================================================ */
var _eSignFile = null;

/* ================================================================
   RENDER FORM
   ================================================================ */
function renderForm(meeting) {
  var typeMap = {
    board_meeting        : 'Board Meeting',
    general_body_meeting : 'General Body Meeting',
    special_meeting      : 'Special Meeting',
    emergency_meeting    : 'Emergency Meeting'
  };
  var typeLabel = typeMap[meeting.meeting_type] || meeting.meeting_type || 'Meeting';
  var agenda    = Array.isArray(meeting.agenda) ? meeting.agenda : [];

  var infoItems = [
    { icon: IC.list,      label: 'Meeting', value: safe(meeting.title) },
    { icon: IC.tag,       label: 'Type',    value: typeLabel },
    { icon: IC.calendar,  label: 'Date',    value: fmtDate(meeting.meeting_date) },
    {
      icon  : IC.clock,
      label : 'Time',
      value : fmtTime(meeting.start_time) +
              (meeting.end_time ? ' &ndash; ' + fmtTime(meeting.end_time) : '')
    },
    { icon: IC.mapPin, label: 'Venue', value: safe(meeting.venue) },
    { icon: IC.hash,   label: 'Group', value: 'Group ' + safe(meeting.group_number || '1') }
  ];

  var html = '';

  /* Info Card */
  html += '<div class="info-card"><div class="info-grid">';
  infoItems.forEach(function(it) {
    html +=
      '<div class="info-item">' +
        '<div class="info-icon">' + it.icon + '</div>' +
        '<div>' +
          '<div class="info-label">' + it.label + '</div>' +
          '<div class="info-value">'  + it.value + '</div>' +
        '</div>' +
      '</div>';
  });
  html += '</div></div>';

  /* Agenda */
  if (agenda.length > 0) {
    html += '<div class="agenda-strip">';
    html += '<div class="agenda-header">' + IC.list + '<span>Agenda</span></div>';
    html += '<ol>';
    agenda.forEach(function(item) {
      html += '<li>' + safe(item.text || item) + '</li>';
    });
    html += '</ol></div>';
  }

  /* Attendance Form */
  html +=
    '<div class="form-card">' +
      '<div class="form-title">' + IC.edit + 'Mark Your Attendance</div>' +
      '<form id="att-form" novalidate>' +

        /* Full Name */
        '<div class="field-group">' +
          '<label class="field-label" for="f-name">' +
            IC.user + 'Full Name <span class="req">*</span>' +
          '</label>' +
          '<input type="text" id="f-name" class="field-input" ' +
                 'placeholder="Enter your full name" ' +
                 'autocomplete="name" required />' +
        '</div>' +

        /* RI ID + In Time */
        '<div class="two-col">' +
          '<div class="field-group">' +
            '<label class="field-label" for="f-riid">' +
              IC.hash + 'RI ID' +
            '</label>' +
            '<input type="text" id="f-riid" class="field-input" ' +
                   'placeholder="RAC/24-25/001" />' +
          '</div>' +
          '<div class="field-group">' +
            '<label class="field-label" for="f-time">' +
              IC.clock + 'In Time <span class="req">*</span>' +
            '</label>' +
            '<input type="time" id="f-time" class="field-input" required />' +
          '</div>' +
        '</div>' +

        /* Designation */
        '<div class="field-group">' +
          '<label class="field-label" for="f-desig">' +
            IC.badge + 'Designation / Role' +
          '</label>' +
          '<input type="text" id="f-desig" class="field-input" ' +
                 'placeholder="President, Secretary, Member..." />' +
        '</div>' +

        /* Email */
        '<div class="field-group">' +
          '<label class="field-label" for="f-email">' +
            IC.mail + 'Email (optional)' +
          '</label>' +
          '<input type="email" id="f-email" class="field-input" ' +
                 'placeholder="you@example.com" autocomplete="email" />' +
        '</div>' +

        /* E-Signature Image Upload */
        '<div class="field-group">' +
          '<label class="field-label">' +
            IC.image + 'Signature Image <span class="req">*</span>' +
          '</label>' +
          '<div class="esign-upload-wrap" id="esign-wrap">' +
            '<input type="file" class="esign-upload-input" id="esign-input" ' +
                   'accept="image/jpeg,image/png,image/webp,image/gif" />' +
            '<div class="esign-upload-icon" id="esign-icon">' + IC.upload + '</div>' +
            '<div class="esign-upload-title" id="esign-title">' +
              'Click or tap to upload your signature image' +
            '</div>' +
            '<div class="esign-upload-hint" id="esign-hint">' +
              'JPG, PNG, WebP &bull; Max 2MB &bull; Clear signature on white/light background' +
            '</div>' +
          '</div>' +
          '<div class="esign-preview-wrap" id="esign-preview-wrap">' +
            '<img id="esign-preview-img" src="" alt="Signature preview" />' +
          '</div>' +
          '<button type="button" class="esign-change-btn" ' +
                  'id="esign-change-btn" style="display:none;"' +
                  'onclick="resetEsign()">' +
            IC.changeImg + ' Change Image' +
          '</button>' +
          '<div class="upload-progress" id="esign-progress">' +
            '<div class="upload-progress-bar" id="esign-progress-bar"></div>' +
          '</div>' +
        '</div>' +

        /* Submit */
        '<button type="submit" class="btn-submit" id="f-submit">' +
          IC.send + '<span>Submit Attendance</span>' +
        '</button>' +

        '<div class="alert alert-error"   id="f-error"></div>' +
        '<div class="alert alert-success" id="f-success"></div>' +

      '</form>' +
    '</div>' +

    '<div class="footer">' +
      IC.shield +
      'Rotaract Club of Dr. N.G.P Arts &amp; Science College' +
    '</div>';

  document.getElementById('page-content').innerHTML = html;

  initEsignUpload();
  initFormSubmit(meeting);

  /* Auto-fill current time */
  var now  = new Date();
  var tinp = document.getElementById('f-time');
  if (tinp) {
    tinp.value =
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0');
  }
}

/* ================================================================
   E-SIGN UPLOAD HANDLER
   ================================================================ */
function initEsignUpload() {
  _eSignFile = null;
  var input   = document.getElementById('esign-input');
  if (!input) return;

  input.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;

    /* Validate type */
    var allowed = ['image/jpeg','image/png','image/webp','image/gif'];
    if (!allowed.includes(file.type)) {
      showAlertEl('f-error', IC.alert,
        'Invalid file type. Please upload a JPG, PNG, or WebP image.');
      input.value = '';
      return;
    }

    /* Validate size — 2MB max */
    if (file.size > 2 * 1024 * 1024) {
      showAlertEl('f-error', IC.alert,
        'File is too large. Maximum allowed size is 2MB.');
      input.value = '';
      return;
    }

    _eSignFile = file;

    /* Preview */
    var reader = new FileReader();
    reader.onload = function(ev) {
      var wrap    = document.getElementById('esign-wrap');
      var preview = document.getElementById('esign-preview-wrap');
      var img     = document.getElementById('esign-preview-img');
      var title   = document.getElementById('esign-title');
      var hint    = document.getElementById('esign-hint');
      var changeBtn = document.getElementById('esign-change-btn');

      if (wrap)    wrap.classList.add('has-file');
      if (img)     img.src = ev.target.result;
      if (preview) preview.style.display = 'block';
      if (title)   title.textContent     = file.name;
      if (hint)    hint.textContent      = (file.size / 1024).toFixed(0) + ' KB';
      if (changeBtn) changeBtn.style.display = 'inline-flex';

      /* Hide error if shown */
      var errEl = document.getElementById('f-error');
      if (errEl) errEl.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });
}

function resetEsign() {
  _eSignFile = null;
  var input     = document.getElementById('esign-input');
  var wrap      = document.getElementById('esign-wrap');
  var preview   = document.getElementById('esign-preview-wrap');
  var title     = document.getElementById('esign-title');
  var hint      = document.getElementById('esign-hint');
  var changeBtn = document.getElementById('esign-change-btn');

  if (input)     { input.value = ''; }
  if (wrap)      wrap.classList.remove('has-file');
  if (preview)   preview.style.display = 'none';
  if (title)     title.textContent = 'Click or tap to upload your signature image';
  if (hint)      hint.innerHTML =
    'JPG, PNG, WebP &bull; Max 2MB &bull; Clear signature on white/light background';
  if (changeBtn) changeBtn.style.display = 'none';
}

/* ================================================================
   FORM SUBMISSION
   ================================================================ */
function initFormSubmit(meeting) {
  var form = document.getElementById('att-form');
  if (!form) return;

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    var errEl  = document.getElementById('f-error');
    var sucEl  = document.getElementById('f-success');
    var btn    = document.getElementById('f-submit');

    if (errEl) errEl.style.display = 'none';
    if (sucEl) sucEl.style.display = 'none';

    var name  = document.getElementById('f-name').value.trim();
    var riId  = document.getElementById('f-riid').value.trim();
    var time  = document.getElementById('f-time').value;
    var desig = document.getElementById('f-desig').value.trim();
    var email = document.getElementById('f-email').value.trim();

    /* Validate */
    if (!name) {
      showAlertEl('f-error', IC.alert, 'Please enter your full name.');
      return;
    }
    if (!time) {
      showAlertEl('f-error', IC.alert, 'Please enter your in-time.');
      return;
    }
    if (!_eSignFile) {
      showAlertEl('f-error', IC.alert,
        'Please upload your signature image before submitting.');
      return;
    }

    btn.disabled   = true;
    btn.innerHTML  = '<div class="spinner"></div><span>Submitting...</span>';

    try {
      /* ── Step 1: Upload signature image to Supabase Storage ── */
      var eSignUrl = null;

      try {
        var ext     = _eSignFile.name.split('.').pop() || 'png';
        var sigName = 'esign_' + meeting.id + '_' + Date.now() + '.' + ext;

        /* Show progress bar */
        var progressWrap = document.getElementById('esign-progress');
        var progressBar  = document.getElementById('esign-progress-bar');
        if (progressWrap) progressWrap.style.display = 'block';
        if (progressBar)  progressBar.style.width = '30%';

        var uploadRes = await fetch(
          SUPABASE_URL + '/storage/v1/object/meetings/' + sigName + '?upsert=true',
          {
            method : 'POST',
            headers: {
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'apikey'       : SUPABASE_KEY,
              'Content-Type' : _eSignFile.type || 'image/png',
              'x-upsert'     : 'true'
            },
            body: _eSignFile
          }
        );

        if (progressBar) progressBar.style.width = '70%';

        if (uploadRes.ok) {
          eSignUrl = SUPABASE_URL +
            '/storage/v1/object/public/meetings/' + sigName;
          if (progressBar) progressBar.style.width = '100%';
        } else {
          var upBody = {};
          try { upBody = await uploadRes.json(); } catch (_) {}
          console.warn('Signature upload failed:',
            uploadRes.status, upBody);
          /* Don't throw — submit attendance without signature */
        }

        if (progressWrap) {
          setTimeout(function() {
            progressWrap.style.display = 'none';
          }, 800);
        }
      } catch (uploadErr) {
        console.warn('Signature upload error:', uploadErr);
        /* Continue without signature */
      }

      /* ── Step 2: Insert attendance record ── */
      var payload = JSON.stringify({
        meeting_id  : meeting.id,
        form_token  : TOKEN,
        member_name : name,
        ri_id       : riId  || null,
        designation : desig || null,
        member_email: email || null,
        in_time     : time,
        e_sign_url  : eSignUrl,
        submitted_at: new Date().toISOString()
      });

      var insertRes = await fetch(
        SUPABASE_URL + '/rest/v1/meeting_attendance',
        {
          method : 'POST',
          headers: {
            'apikey'        : SUPABASE_KEY,
            'Authorization' : 'Bearer ' + SUPABASE_KEY,
            'Content-Type'  : 'application/json',
            'Accept'        : 'application/json',
            'Prefer'        : 'return=minimal'
          },
          body: payload
        }
      );

      /* Handle errors */
      if (!insertRes.ok) {
        var errBody = {};
        try { errBody = await insertRes.json(); } catch (_) {}

        console.error('Insert failed:', insertRes.status, errBody);

        /* Duplicate entry */
        if (errBody.code === '23505' ||
            (errBody.message && errBody.message.includes('unique'))) {
          throw new Error(
            'You have already submitted attendance for this meeting.'
          );
        }

        /* Auth error */
        if (insertRes.status === 401) {
          throw new Error(
            'Authentication error (401). ' +
            'Please ask the admin to check the Supabase RLS policies.'
          );
        }

        throw new Error(
          errBody.message || errBody.error ||
          'Submission failed (status ' + insertRes.status + '). ' +
          'Please try again.'
        );
      }

      /* ── Step 3: Show success ── */
      document.getElementById('page-content').innerHTML =
        '<div class="state-card">' +
          '<div class="state-icon success">' + IC.check + '</div>' +
          '<div class="state-title">Attendance Recorded!</div>' +
          '<div class="state-msg">' +
            'Thank you, <strong>' + safe(name) + '</strong>. ' +
            'Your attendance has been successfully recorded' +
            (eSignUrl ? ' along with your signature image.' : '.') +
          '</div>' +
        '</div>' +
        '<div class="footer">' + IC.shield +
          'Rotaract Club of Dr. N.G.P Arts &amp; Science College' +
        '</div>';

    } catch (err) {
      console.error('Submission error:', err);
      showAlertEl('f-error', IC.xCircle,
        err.message || 'Something went wrong. Please try again.');
      btn.disabled  = false;
      btn.innerHTML = IC.send + '<span>Submit Attendance</span>';
    }
  });
}

/* ================================================================
   SHOW ALERT INSIDE FORM
   ================================================================ */
function showAlertEl(elId, iconSvg, msg) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML =
    '<div class="alert-row">' + iconSvg + '<span>' + msg + '</span></div>';
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ================================================================
   INIT — Validate params → fetch meeting → render form
   ================================================================ */
async function init() {

  if (!MEETING_ID || !TOKEN) {
    showState('error', 'Invalid Link',
      'This attendance form link is invalid or missing required parameters. ' +
      'Please contact the meeting organizer for a valid link.');
    return;
  }

  try {
    /* Fetch meeting — use explicit column list */
    var res = await sbFetch(
      '/rest/v1/meetings' +
      '?id=eq.' + encodeURIComponent(MEETING_ID) +
      '&select=id,title,meeting_type,meeting_date,' +
              'start_time,end_time,venue,group_number,' +
              'agenda,attendance_form_token',
      { method: 'GET' }
    );

    if (!res.ok) {
      var errJson = {};
      try { errJson = await res.json(); } catch (_) {}
      console.error('Meeting fetch failed:', res.status, errJson);
      throw new Error(
        'Server returned ' + res.status +
        (errJson.message ? ': ' + errJson.message : '')
      );
    }

    var rows = await res.json();

    if (!rows || rows.length === 0) {
      showState('error', 'Meeting Not Found',
        'This meeting does not exist or has been removed.');
      return;
    }

    var meeting = rows[0];

    /* Validate token */
    if (meeting.attendance_form_token !== TOKEN) {
      showState('error', 'Invalid Token',
        'This attendance form link is no longer valid. ' +
        'Please request a new link from the organizer.');
      return;
    }

    renderForm(meeting);

  } catch (err) {
    console.error('Init error:', err);
    showState('error', 'Loading Failed',
      'Could not load the attendance form. <br>' +
      '<small style="color:#9ca3af;">' + safe(err.message) + '</small><br><br>' +
      'Please check your connection and refresh the page.');
  }
}

init();
</script>
