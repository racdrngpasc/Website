<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Attendance – Rotaract Club of Dr. N.G.P</title>
  <link rel="icon" type="image/png"
        href="https://res.cloudinary.com/qxbjvkq6/image/upload/v1784713317/ngp_logo_colourAsset_2_2x-8_lu8zgf.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
  <style>
    /* ============================================================
       VARIABLES & THEMING
       ============================================================ */
    :root {
      /* Light / Neumorphic Base */
      --bg       : #e0e0e0;
      --bg-card  : #e0e0e0;
      --shadow-lt: #ffffff;
      --shadow-dk: #a3b1c6;
      --text-1   : #2d3748;
      --text-2   : #718096;
      --text-3   : #a0aec0;
      --accent   : #2563eb;
      --accent-dk: #1e40af;
      --accent-lt: rgba(37,99,235,0.12);
      --success  : #16a34a;
      --success-lt: #dcfce7;
      --danger   : #dc2626;
      --danger-lt: #fee2e2;
      --warning  : #d97706;
      --warning-lt:#fef3c7;
      --radius   : 16px;
      --radius-sm: 10px;
      --radius-xs: 7px;
      --font     : 'Inter', system-ui, -apple-system, sans-serif;

      /* Neu shadows */
      --neu-out  : 6px 6px 12px var(--shadow-dk),
                   -6px -6px 12px var(--shadow-lt);
      --neu-out-sm: 3px 3px 6px var(--shadow-dk),
                   -3px -3px 6px var(--shadow-lt);
      --neu-in   : inset 3px 3px 6px var(--shadow-dk),
                   inset -3px -3px 6px var(--shadow-lt);
      --neu-flat : 0 0 0 transparent;
    }

    /* ── Dark Mode ── */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg       : #1f1f1f;
        --bg-card  : #1f1f1f;
        --shadow-lt: #3a3a3a;
        --shadow-dk: #0f0f0f;
        --text-1   : #e0e0e0;
        --text-2   : #a0aec0;
        --text-3   : #718096;
        --accent-lt: rgba(37,99,235,0.18);
        --success-lt: rgba(22,163,74,0.15);
        --danger-lt: rgba(220,38,38,0.15);
        --warning-lt: rgba(217,119,6,0.15);
      }
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }

    body {
      font-family: var(--font);
      background : var(--bg);
      color      : var(--text-1);
      min-height : 100vh;
      padding    : 32px 16px 64px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    /* ============================================================
       WRAPPER
       ============================================================ */
    .wrapper {
      max-width: 660px;
      margin: 0 auto;
    }

    /* ============================================================
       HERO BANNER — Neumorphic Raised Card
       ============================================================ */
    .hero {
      background : var(--bg-card);
      border-radius: var(--radius);
      box-shadow : var(--neu-out);
      padding    : 36px 28px 28px;
      text-align : center;
      margin-bottom: 24px;
      position   : relative;
      overflow   : hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-dk), #7c3aed);
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .hero-logo {
      width: 72px; height: 72px;
      border-radius: 50%;
      box-shadow: var(--neu-out-sm);
      background: var(--bg-card);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      padding: 8px;
      overflow: hidden;
    }
    .hero-logo img {
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .hero h1 {
      font-size  : 1.2rem;
      font-weight: 800;
      color      : var(--text-1);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .hero p {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-2);
      letter-spacing: 0.03em;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 6px 16px;
      border-radius: 99px;
      background: var(--accent-lt);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero-badge svg {
      width: 13px; height: 13px;
      stroke: var(--accent); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ============================================================
       NEU CARD (reusable)
       ============================================================ */
    .neu-card {
      background   : var(--bg-card);
      border-radius: var(--radius);
      box-shadow   : var(--neu-out);
      margin-bottom: 20px;
    }

    /* ============================================================
       MEETING INFO CARD
       ============================================================ */
    .info-section {
      padding: 22px 24px;
    }
    .info-section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.76rem; font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1.5px solid var(--accent-lt);
    }
    .info-section-title svg {
      width: 15px; height: 15px;
      stroke: var(--accent); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }

    .info-tile {
      display: flex; align-items: flex-start; gap: 10px;
    }
    .info-tile-icon {
      width: 36px; height: 36px;
      border-radius: var(--radius-xs);
      background: var(--bg-card);
      box-shadow: var(--neu-out-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .info-tile-icon svg {
      width: 15px; height: 15px;
      stroke: var(--accent); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .info-tile-label {
      font-size: 0.62rem; font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 3px;
    }
    .info-tile-value {
      font-size: 0.82rem; font-weight: 600;
      color: var(--text-1); line-height: 1.35;
    }

    /* ============================================================
       AGENDA SECTION
       ============================================================ */
    .agenda-section {
      padding: 16px 24px 18px;
      border-top: 1.5px solid var(--accent-lt);
    }
    .agenda-title {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.72rem; font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    .agenda-title svg {
      width: 14px; height: 14px;
      stroke: var(--accent); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .agenda-list {
      padding-left: 20px;
      margin: 0;
    }
    .agenda-list li {
      font-size: 0.81rem; color: var(--text-2);
      margin-bottom: 5px; line-height: 1.55;
      font-weight: 500;
    }
    .agenda-list li::marker {
      color: var(--accent);
      font-weight: 700;
    }

    /* ============================================================
       ATTENDANCE FORM CARD
       ============================================================ */
    .form-section {
      padding: 24px;
    }
    .form-header {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.95rem; font-weight: 700;
      color: var(--text-1);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--accent-lt);
    }
    .form-header svg {
      width: 19px; height: 19px;
      stroke: var(--accent); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Field ── */
    .field {
      margin-bottom: 18px;
    }
    .field-lbl {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.69rem; font-weight: 700;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .field-lbl svg {
      width: 13px; height: 13px;
      stroke: var(--text-3); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .field-lbl .req {
      color: var(--danger);
      margin-left: 1px;
    }

    /* ── Neumorphic Inset Input ── */
    .neu-input {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      box-shadow: var(--neu-in);
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--text-1);
      font-family: var(--font);
      outline: none;
      transition: box-shadow 0.25s, color 0.2s;
      -webkit-appearance: none;
    }
    .neu-input::placeholder {
      color: var(--text-3);
      font-weight: 400;
    }
    .neu-input:focus {
      box-shadow: var(--neu-in),
                  0 0 0 3px var(--accent-lt);
    }

    /* ── Two Column ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 480px) {
      .two-col { grid-template-columns: 1fr; }
    }

    /* ============================================================
       E-SIGNATURE UPLOAD — Neumorphic Inset Area
       ============================================================ */
    .esign-area {
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      box-shadow: var(--neu-in);
      padding: 28px 20px;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: box-shadow 0.25s;
    }
    .esign-area:hover {
      box-shadow: var(--neu-in),
                  0 0 0 3px var(--accent-lt);
    }
    .esign-area.filled {
      box-shadow: var(--neu-in),
                  0 0 0 3px rgba(22,163,74,0.18);
      padding: 16px 20px;
    }

    .esign-file {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; z-index: 3;
    }

    .esign-ph { pointer-events: none; }
    .esign-ph-icon {
      width: 50px; height: 50px;
      margin: 0 auto 12px;
      border-radius: var(--radius-xs);
      background: var(--bg-card);
      box-shadow: var(--neu-out-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .esign-ph-icon svg {
      width: 22px; height: 22px;
      stroke: var(--text-3); fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .esign-area.filled .esign-ph-icon svg {
      stroke: var(--success);
    }
    .esign-ph-title {
      font-size: 0.84rem; font-weight: 600;
      color: var(--text-2); margin-bottom: 4px;
    }
    .esign-area.filled .esign-ph-title {
      color: var(--success);
    }
    .esign-ph-hint {
      font-size: 0.71rem; color: var(--text-3);
      line-height: 1.4; font-weight: 500;
    }

    /* Preview */
    .esign-preview {
      display: none;
      margin-top: 12px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-card);
      box-shadow: var(--neu-out-sm);
    }
    .esign-preview img {
      display: block; width: 100%;
      max-height: 150px; object-fit: contain;
      padding: 10px;
    }
    .esign-preview-bar {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid var(--accent-lt);
    }
    .esign-fname {
      font-size: 0.72rem; font-weight: 600;
      color: var(--success);
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 220px;
    }
    .esign-rm-btn {
      flex-shrink: 0;
      background: var(--bg-card);
      box-shadow: var(--neu-out-sm);
      border: none; border-radius: var(--radius-xs);
      padding: 5px 12px;
      font-size: 0.7rem; font-weight: 700;
      color: var(--danger); cursor: pointer;
      font-family: var(--font);
      transition: box-shadow 0.2s;
    }
    .esign-rm-btn:hover {
      box-shadow: var(--neu-in);
    }

    /* Progress */
    .prog {
      display: none;
      height: 4px;
      background: var(--bg-card);
      box-shadow: var(--neu-in);
      border-radius: 99px;
      margin-top: 10px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-dk));
      border-radius: 99px;
      width: 0%;
      transition: width 0.35s ease;
    }

    /* ============================================================
       SUBMIT BUTTON — Neumorphic Raised
       ============================================================ */
    .btn-submit {
      display: flex; align-items: center;
      justify-content: center; gap: 10px;
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dk) 100%);
      color: #fff; border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer; margin-top: 24px;
      letter-spacing: 0.02em;
      font-family: var(--font);
      box-shadow: 4px 4px 10px var(--shadow-dk),
                  -2px -2px 6px var(--shadow-lt),
                  inset 0 1px 0 rgba(255,255,255,0.15);
      transition: opacity 0.2s, transform 0.12s, box-shadow 0.2s;
    }
    .btn-submit svg {
      width: 19px; height: 19px;
      stroke: currentColor; fill: none;
      stroke-width: 2.5; stroke-linecap: round;
      stroke-linejoin: round; flex-shrink: 0;
    }
    .btn-submit:hover {
      opacity: 0.93;
      transform: translateY(-1px);
      box-shadow: 6px 6px 14px var(--shadow-dk),
                  -3px -3px 8px var(--shadow-lt);
    }
    .btn-submit:active {
      transform: translateY(0);
      box-shadow: var(--neu-in);
    }
    .btn-submit:disabled {
      opacity: 0.5; cursor: not-allowed; transform: none;
      box-shadow: var(--neu-flat);
    }

    /* ── Spinner ── */
    .spinner {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       ALERTS — Neumorphic Inset
       ============================================================ */
    .alert {
      display: none;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      margin-top: 16px;
      font-size: 0.84rem;
      font-weight: 500;
      line-height: 1.5;
    }
    .alert-row {
      display: flex; align-items: flex-start; gap: 9px;
    }
    .alert-row svg {
      width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .alert-error {
      background: var(--danger-lt);
      color: var(--danger);
      box-shadow: var(--neu-in);
    }
    .alert-success {
      background: var(--success-lt);
      color: var(--success);
      box-shadow: var(--neu-in);
    }

    /* ============================================================
       STATE CARD (full-page error / success)
       ============================================================ */
    .state-card {
      padding: 56px 28px;
      text-align: center;
    }
    .state-icon {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--bg-card);
      box-shadow: var(--neu-out);
      display: flex; align-items: center; justify-content: center;
    }
    .state-icon svg {
      width: 34px; height: 34px; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .state-icon.si-err svg { stroke: var(--danger); }
    .state-icon.si-ok  svg { stroke: var(--success); }
    .state-title {
      font-size: 1.1rem; font-weight: 800;
      color: var(--text-1); margin-bottom: 8px;
    }
    .state-msg {
      font-size: 0.85rem; color: var(--text-2);
      line-height: 1.65; max-width: 380px; margin: 0 auto;
    }
    .state-msg strong { color: var(--text-1); }

    /* ============================================================
       SKELETON LOADING
       ============================================================ */
    .sk {
      background: linear-gradient(
        90deg,
        var(--shadow-dk) 25%,
        var(--bg-card) 50%,
        var(--shadow-dk) 75%
      );
      background-size: 200% 100%;
      border-radius: var(--radius-xs);
      animation: shim 1.5s ease infinite;
    }
    @keyframes shim {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.69rem;
      color: var(--text-3);
      font-weight: 500;
      display: flex; align-items: center;
      justify-content: center; gap: 6px;
    }
    .footer img {
      width: 14px; height: 14px;
      object-fit: contain;
      opacity: 0.5;
    }
  </style>
</head>

/* ================================================================
   HELPERS
   ================================================================ */
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '-';
  try {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', {
      weekday:'long', year:'numeric', month:'long', day:'numeric'
    });
  } catch(_) { return d; }
}

function fmtTime(t) {
  if (!t) return '-';
  try {
    var p = t.split(':').map(Number);
    return (p[0] % 12 || 12) + ':' +
           String(p[1]).padStart(2,'0') +
           (p[0] >= 12 ? ' PM' : ' AM');
  } catch(_) { return t; }
}

async function sbRest(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({
    'apikey'       : SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type' : 'application/json',
    'Accept'       : 'application/json'
  }, opts.headers || {});
  return fetch((path.startsWith('http') ? '' : SB_URL) + path, opts);
}

function showState(type, title, msg) {
  var cls = type === 'success' ? 'si-ok' : 'si-err';
  var ico = type === 'success' ? IC.ok : IC.errC;
  document.getElementById('root').innerHTML =
    '<div class="neu-card"><div class="state-card">' +
      '<div class="state-icon ' + cls + '">' + ico + '</div>' +
      '<div class="state-title">' + title + '</div>' +
      '<div class="state-msg">' + msg + '</div>' +
    '</div></div>' +
    '<div class="footer">' +
      '<img src="' + LOGO_BLK + '" alt="" />' +
      'Rotaract Club of Dr. N.G.P Arts &amp; Science College' +
    '</div>';
}

function showAlert(id, ico, msg) {
  var el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '<div class="alert-row">' + ico +
    '<span>' + msg + '</span></div>';
  el.style.display = 'block';
  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* ================================================================
   ESIGN STATE
   ================================================================ */
var _sf = null;

/* ================================================================
   RENDER FORM
   ================================================================ */
function renderForm(m) {
  var TM = {
    board_meeting        : 'Board Meeting',
    general_body_meeting : 'General Body Meeting',
    special_meeting      : 'Special Meeting',
    emergency_meeting    : 'Emergency Meeting'
  };
  var tl = TM[m.meeting_type] || m.meeting_type || 'Meeting';
  var ag = Array.isArray(m.agenda) ? m.agenda : [];

  var tiles = [
    { ic: IC.list,     lb: 'Meeting', vl: esc(m.title) },
    { ic: IC.tag,      lb: 'Type',    vl: tl },
    { ic: IC.calendar, lb: 'Date',    vl: fmtDate(m.meeting_date) },
    {
      ic: IC.clock, lb: 'Time',
      vl: fmtTime(m.start_time) +
          (m.end_time ? ' &ndash; ' + fmtTime(m.end_time) : '')
    },
    { ic: IC.pin,  lb: 'Venue', vl: esc(m.venue) },
    { ic: IC.hash, lb: 'Group', vl: 'Group ' + esc(m.group_number || '1') }
  ];

  var h = '';

  /* ── Info Card ── */
  h += '<div class="neu-card">';
  h += '<div class="info-section">';
  h += '<div class="info-section-title">' + IC.info + 'Meeting Details</div>';
  h += '<div class="info-grid">';
  tiles.forEach(function(t) {
    h +=
      '<div class="info-tile">' +
        '<div class="info-tile-icon">' + t.ic + '</div>' +
        '<div>' +
          '<div class="info-tile-label">' + t.lb + '</div>' +
          '<div class="info-tile-value">' + t.vl + '</div>' +
        '</div>' +
      '</div>';
  });
  h += '</div></div>';

  /* Agenda */
  if (ag.length > 0) {
    h += '<div class="agenda-section">';
    h += '<div class="agenda-title">' + IC.list + '<span>Agenda</span></div>';
    h += '<ol class="agenda-list">';
    ag.forEach(function(item) {
      h += '<li>' + esc(item.text || item) + '</li>';
    });
    h += '</ol></div>';
  }
  h += '</div>';

  /* ── Form Card ── */
  h += '<div class="neu-card"><div class="form-section">';

  h += '<div class="form-header">' + IC.edit + 'Mark Your Attendance</div>';

  h += '<form id="att-form" novalidate>';

  /* Full Name */
  h +=
    '<div class="field">' +
      '<label class="field-lbl" for="f-name">' +
        IC.user + 'Full Name <span class="req">*</span>' +
      '</label>' +
      '<input type="text" id="f-name" class="neu-input" ' +
             'placeholder="Enter your full name" ' +
             'autocomplete="name" required />' +
    '</div>';

  /* RI ID + In Time */
  h +=
    '<div class="two-col">' +
      '<div class="field">' +
        '<label class="field-lbl" for="f-riid">' +
          IC.hash + 'RI ID' +
        '</label>' +
        '<input type="text" id="f-riid" class="neu-input" ' +
               'placeholder="RAC/24-25/001" />' +
      '</div>' +
      '<div class="field">' +
        '<label class="field-lbl" for="f-time">' +
          IC.clock + 'In Time <span class="req">*</span>' +
        '</label>' +
        '<input type="time" id="f-time" class="neu-input" required />' +
      '</div>' +
    '</div>';

  /* Designation */
  h +=
    '<div class="field">' +
      '<label class="field-lbl" for="f-desig">' +
        IC.badge + 'Designation / Role' +
      '</label>' +
      '<input type="text" id="f-desig" class="neu-input" ' +
             'placeholder="President, Secretary, Member..." />' +
    '</div>';

  /* Email */
  h +=
    '<div class="field">' +
      '<label class="field-lbl" for="f-email">' +
        IC.mail + 'Email (optional)' +
      '</label>' +
      '<input type="email" id="f-email" class="neu-input" ' +
             'placeholder="you@example.com" autocomplete="email" />' +
    '</div>';

  /* E-Signature Upload */
  h +=
    '<div class="field">' +
      '<label class="field-lbl">' +
        IC.image + 'Signature Image <span class="req">*</span>' +
      '</label>' +

      '<div class="esign-area" id="esign-area">' +
        '<input type="file" class="esign-file" id="esign-file" ' +
               'accept="image/jpeg,image/png,image/webp,image/gif" />' +
        '<div class="esign-ph" id="esign-ph">' +
          '<div class="esign-ph-icon">' + IC.upload + '</div>' +
          '<div class="esign-ph-title" id="esign-ph-title">' +
            'Click or tap to upload your signature' +
          '</div>' +
          '<div class="esign-ph-hint">' +
            'JPG, PNG, WebP &bull; Max 2 MB' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="esign-preview" id="esign-preview">' +
        '<img id="esign-img" src="" alt="Signature preview" />' +
        '<div class="esign-preview-bar">' +
          '<span class="esign-fname" id="esign-fname"></span>' +
          '<button type="button" class="esign-rm-btn" ' +
                  'onclick="rmSign()">Remove</button>' +
        '</div>' +
      '</div>' +

      '<div class="prog" id="prog">' +
        '<div class="prog-fill" id="prog-fill"></div>' +
      '</div>' +

    '</div>';

  /* Submit */
  h +=
    '<button type="submit" class="btn-submit" id="f-btn">' +
      IC.send + '<span>Submit Attendance</span>' +
    '</button>';

  h +=
    '<div class="alert alert-error"   id="f-err"></div>' +
    '<div class="alert alert-success" id="f-ok"></div>';

  h += '</form></div></div>';

  /* Footer */
  h +=
    '<div class="footer">' +
      '<img src="' + LOGO_BLK + '" alt="" />' +
      'Rotaract Club of Dr. N.G.P Arts &amp; Science College' +
    '</div>';

  document.getElementById('root').innerHTML = h;

  /* Wire events */
  document.getElementById('esign-file')
    .addEventListener('change', onFileChange);

  var now  = new Date();
  var tinp = document.getElementById('f-time');
  if (tinp)
    tinp.value =
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0');

  document.getElementById('att-form')
    .addEventListener('submit', function(e) {
      e.preventDefault();
      doSubmit(m);
    });
}

/* ================================================================
   ESIGN FILE HANDLERS
   ================================================================ */
function onFileChange(e) {
  var f = e.target.files[0];
  if (!f) return;

  var errEl = document.getElementById('f-err');
  if (errEl) errEl.style.display = 'none';

  var ok = ['image/jpeg','image/png','image/webp','image/gif'];
  if (ok.indexOf(f.type) === -1) {
    showAlert('f-err', IC.warn,
      'Invalid file type. Please upload JPG, PNG, or WebP.');
    e.target.value = '';
    return;
  }
  if (f.size > 2 * 1024 * 1024) {
    showAlert('f-err', IC.warn,
      'File too large. Maximum 2 MB allowed.');
    e.target.value = '';
    return;
  }

  _sf = f;

  var reader = new FileReader();
  reader.onload = function(ev) {
    var area    = document.getElementById('esign-area');
    var preview = document.getElementById('esign-preview');
    var img     = document.getElementById('esign-img');
    var phTitle = document.getElementById('esign-ph-title');
    var fname   = document.getElementById('esign-fname');

    if (area)    area.classList.add('filled');
    if (phTitle) phTitle.textContent = f.name;
    if (img)     img.src = ev.target.result;
    if (preview) preview.style.display = 'block';
    if (fname)   fname.textContent = f.name +
      ' (' + (f.size / 1024).toFixed(0) + ' KB)';
  };
  reader.readAsDataURL(f);
}

function rmSign() {
  _sf = null;
  var inp  = document.getElementById('esign-file');
  var area = document.getElementById('esign-area');
  var prev = document.getElementById('esign-preview');
  var pht  = document.getElementById('esign-ph-title');
  if (inp)  inp.value = '';
  if (area) area.classList.remove('filled');
  if (prev) prev.style.display = 'none';
  if (pht)  pht.textContent =
    'Click or tap to upload your signature';
}

/* ================================================================
   SUBMIT
   ================================================================ */
async function doSubmit(m) {
  var errEl = document.getElementById('f-err');
  var btn   = document.getElementById('f-btn');
  if (errEl) errEl.style.display = 'none';

  var name  = document.getElementById('f-name').value.trim();
  var riId  = document.getElementById('f-riid').value.trim();
  var time  = document.getElementById('f-time').value;
  var desig = document.getElementById('f-desig').value.trim();
  var email = document.getElementById('f-email').value.trim();

  if (!name) { showAlert('f-err', IC.warn, 'Please enter your full name.'); return; }
  if (!time) { showAlert('f-err', IC.warn, 'Please enter your in-time.');   return; }
  if (!_sf)  { showAlert('f-err', IC.warn, 'Please upload your signature image.'); return; }

  btn.disabled  = true;
  btn.innerHTML = '<div class="spinner"></div><span>Submitting...</span>';

  try {
    /* 1. Upload e-sign image */
    var eSignUrl = null;
    var ext = (_sf.name.split('.').pop() || 'png').toLowerCase();
    var sigName = 'esign_' + m.id + '_' + Date.now() + '.' + ext;

    var pw = document.getElementById('prog');
    var pb = document.getElementById('prog-fill');
    if (pw) pw.style.display = 'block';
    if (pb) pb.style.width   = '30%';

    var upRes = await fetch(
      SB_URL + '/storage/v1/object/meetings/' + sigName,
      {
        method : 'POST',
        headers: {
          'apikey'       : SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type' : _sf.type || 'image/png',
          'x-upsert'     : 'true'
        },
        body: _sf
      }
    );

    if (pb) pb.style.width = '70%';

    if (upRes.ok) {
      eSignUrl = SB_URL +
        '/storage/v1/object/public/meetings/' + sigName;
      if (pb) pb.style.width = '100%';
    } else {
      var ue = {};
      try { ue = await upRes.json(); } catch(_) {}
      console.warn('Sig upload failed:', upRes.status, ue);
    }

    if (pw) setTimeout(function() { pw.style.display = 'none'; }, 800);

    /* 2. Insert attendance */
    var insRes = await fetch(
      SB_URL + '/rest/v1/meeting_attendance',
      {
        method : 'POST',
        headers: {
          'apikey'       : SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type' : 'application/json',
          'Accept'       : 'application/json',
          'Prefer'       : 'return=minimal'
        },
        body: JSON.stringify({
          meeting_id  : m.id,
          form_token  : TOKEN,
          member_name : name,
          ri_id       : riId  || null,
          designation : desig || null,
          member_email: email || null,
          in_time     : time,
          e_sign_url  : eSignUrl,
          submitted_at: new Date().toISOString()
        })
      }
    );

    if (!insRes.ok) {
      var ie = {};
      try { ie = await insRes.json(); } catch(_) {}
      console.error('Insert failed:', insRes.status, ie);

      if (ie.code === '23505' ||
          (ie.message && ie.message.toLowerCase().includes('unique'))) {
        throw new Error(
          'You have already submitted attendance for this meeting.');
      }
      if (insRes.status === 401 || insRes.status === 403) {
        throw new Error(
          'Permission denied (' + insRes.status + '). Contact admin.');
      }
      throw new Error(
        ie.message || ie.error ||
        'Failed (HTTP ' + insRes.status + '). Try again.');
    }

    /* 3. Success */
    showState('success', 'Attendance Recorded!',
      'Thank you, <strong>' + esc(name) + '</strong>!<br>' +
      'Your attendance has been successfully marked' +
      (eSignUrl ? ' with your uploaded signature.' : '.') +
      '<br><br>' +
      '<span style="font-size:0.78rem;color:var(--text-3);">' +
        'You may now close this page.' +
      '</span>'
    );

  } catch (err) {
    console.error('Submit error:', err);
    showAlert('f-err', IC.x,
      err.message || 'Something went wrong. Please try again.');
    btn.disabled  = false;
    btn.innerHTML = IC.send + '<span>Submit Attendance</span>';
  }
}

/* ================================================================
   INIT
   ================================================================ */
async function init() {
  if (!MEETING_ID || !TOKEN) {
    showState('error', 'Invalid Link',
      'This attendance form link is invalid or missing required ' +
      'parameters. Please contact the organizer for a valid link.');
    return;
  }

  try {
    var res = await sbRest(
      '/rest/v1/meetings' +
      '?id=eq.' + encodeURIComponent(MEETING_ID) +
      '&select=id,title,meeting_type,meeting_date,' +
              'start_time,end_time,venue,group_number,' +
              'agenda,attendance_form_token',
      { method: 'GET' }
    );

    if (!res.ok) {
      var ej = {};
      try { ej = await res.json(); } catch(_) {}
      throw new Error('HTTP ' + res.status +
        (ej.message ? ': ' + ej.message : ''));
    }

    var rows = await res.json();

    if (!rows || rows.length === 0) {
      showState('error', 'Meeting Not Found',
        'This meeting does not exist or has been removed.');
      return;
    }

    var mtg = rows[0];

    if (mtg.attendance_form_token !== TOKEN) {
      showState('error', 'Invalid Token',
        'This link is no longer valid. ' +
        'Please request a new attendance form link from the organizer.');
      return;
    }

    renderForm(mtg);

  } catch (err) {
    console.error('Init error:', err);
    showState('error', 'Could Not Load Form',
      'Failed to load the attendance form.<br>' +
      '<small style="color:var(--text-3);font-size:0.76rem;">' +
        esc(err.message) +
      '</small><br><br>' +
      'Check your internet connection and refresh the page.');
  }
}

init();
</script>
