<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Attendance – Rotaract Club</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      background: #f0f4f8;
      color: #1a2b4a;
      min-height: 100vh;
      padding: 24px 16px 60px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Wrapper ── */
    .wrapper { max-width: 720px; margin: 0 auto; }

    /* ── Banner ── */
    .banner {
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      border-radius: 16px 16px 0 0;
      padding: 32px 32px 24px;
      text-align: center;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .banner::after {
      content: '';
      position: absolute;
      top: -30%; right: -20%;
      width: 260px; height: 260px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .banner-logo {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      position: relative; z-index: 1;
    }
    .banner-logo svg {
      width: 32px; height: 32px; stroke: #fff; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .banner h1 {
      font-size: 1.35rem; font-weight: 800;
      margin-bottom: 6px; position: relative; z-index: 1;
    }
    .banner p {
      font-size: 0.85rem; opacity: 0.85;
      position: relative; z-index: 1;
    }

    /* ── Info Card ── */
    .info-card {
      background: #fff;
      padding: 24px 28px;
      border-left: 4px solid #2563eb;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .info-item { display: flex; align-items: flex-start; gap: 10px; }
    .info-icon {
      width: 32px; height: 32px; flex-shrink: 0;
      background: #eff6ff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .info-icon svg {
      width: 16px; height: 16px; stroke: #2563eb; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .info-label {
      font-size: 0.65rem; font-weight: 700; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .info-value { font-size: 0.86rem; font-weight: 600; color: #1a2b4a; }

    /* ── Agenda Strip ── */
    .agenda-strip {
      background: #eff6ff; padding: 16px 28px;
      border-left: 4px solid #93c5fd;
    }
    .agenda-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .agenda-header svg {
      width: 16px; height: 16px; stroke: #1e40af; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .agenda-header span {
      font-size: 0.76rem; font-weight: 700; color: #1e40af;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .agenda-strip ol { padding-left: 20px; }
    .agenda-strip li {
      font-size: 0.83rem; color: #374151;
      margin-bottom: 5px; line-height: 1.5;
    }

    /* ── Form Card ── */
    .form-card {
      background: #fff;
      padding: 28px;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .form-title {
      font-size: 1rem; font-weight: 700; color: #1a2b4a;
      margin-bottom: 22px;
      display: flex; align-items: center; gap: 10px;
    }
    .form-title svg {
      width: 20px; height: 20px; stroke: #2563eb; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Fields ── */
    .field-group { margin-bottom: 18px; }
    .field-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 700; color: #374151;
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 7px;
    }
    .field-label svg {
      width: 14px; height: 14px; stroke: #6b7280; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .field-label .req { color: #ef4444; margin-left: 1px; font-size: 0.8rem; }
    .field-input {
      width: 100%; padding: 12px 14px;
      border: 2px solid #e5e7eb; border-radius: 10px;
      font-size: 0.88rem; color: #1a2b4a;
      background: #f9fafb; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .field-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
      background: #fff;
    }
    .field-input::placeholder { color: #9ca3af; }

    /* ── Two-col ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 500px) { .two-col { grid-template-columns: 1fr; } }

    /* ── Signature Pad ── */
    .sign-section { margin-bottom: 18px; }
    .sign-wrap {
      border: 2px dashed #d1d5db; border-radius: 10px;
      padding: 8px; background: #f9fafb; cursor: crosshair;
      position: relative;
    }
    .sign-wrap.active { border-color: #2563eb; }
    .sign-canvas {
      display: block; width: 100%; height: 140px;
      touch-action: none; border-radius: 6px;
    }
    .sign-placeholder {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #9ca3af; font-size: 0.82rem; font-weight: 500;
      pointer-events: none;
      display: flex; align-items: center; gap: 8px;
      transition: opacity 0.3s;
    }
    .sign-placeholder svg {
      width: 18px; height: 18px; stroke: #9ca3af; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .sign-placeholder.hidden { opacity: 0; }
    .sign-actions {
      display: flex; justify-content: flex-end; margin-top: 6px;
    }
    .btn-clear {
      font-size: 0.75rem; font-weight: 600; color: #6b7280;
      background: none; border: 1px solid #d1d5db;
      border-radius: 6px; padding: 5px 14px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background 0.2s;
    }
    .btn-clear:hover { background: #f3f4f6; }
    .btn-clear svg {
      width: 13px; height: 13px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Submit Button ── */
    .btn-submit {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; width: 100%; padding: 15px;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      color: #fff; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 24px; letter-spacing: 0.02em;
      box-shadow: 0 4px 16px rgba(37,99,235,0.3);
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled {
      opacity: 0.55; cursor: not-allowed; transform: none;
    }
    .btn-submit svg {
      width: 20px; height: 20px; stroke: currentColor; fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Spinner ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alerts ── */
    .alert {
      display: none; padding: 18px 20px; border-radius: 12px;
      font-weight: 600; font-size: 0.88rem; margin-top: 18px;
      line-height: 1.5;
    }
    .alert-success {
      background: #dcfce7; color: #166534;
      border: 1.5px solid #bbf7d0;
    }
    .alert-error {
      background: #fee2e2; color: #991b1b;
      border: 1.5px solid #fecaca;
    }
    .alert-icon {
      display: flex; align-items: center; gap: 10px;
    }
    .alert-icon svg {
      width: 20px; height: 20px; flex-shrink: 0;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── State Card (loading, error, success fullscreen) ── */
    .state-card {
      background: #fff; padding: 48px 32px;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      text-align: center;
    }
    .state-icon {
      width: 72px; height: 72px; margin: 0 auto 20px;
      background: #eff6ff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .state-icon svg {
      width: 36px; height: 36px; stroke: #2563eb; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .state-icon.error-icon { background: #fee2e2; }
    .state-icon.error-icon svg { stroke: #dc2626; }
    .state-icon.success-icon { background: #dcfce7; }
    .state-icon.success-icon svg { stroke: #16a34a; }
    .state-title {
      font-size: 1.15rem; font-weight: 700; color: #1a2b4a;
      margin-bottom: 8px;
    }
    .state-msg { font-size: 0.88rem; color: #6b7280; line-height: 1.5; }

    /* ── Skeleton Loading ── */
    .skeleton {
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%;
      border-radius: 8px;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Footer ── */
    .footer {
      text-align: center; margin-top: 24px;
      font-size: 0.72rem; color: #9ca3af;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .footer svg {
      width: 12px; height: 12px; stroke: #9ca3af; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
  </style>
</head>

/* ================================================================
   HELPER FUNCTIONS
   ================================================================ */
function safe(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtDate(d) {
  if (!d) return '-';
  try {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  } catch (_) { return d; }
}

function fmtTime(t) {
  if (!t) return '-';
  try {
    var parts = t.split(':').map(Number);
    var h = parts[0], m = parts[1];
    var ampm = h >= 12 ? 'PM' : 'AM';
    return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + ' ' + ampm;
  } catch (_) { return t; }
}

async function sbFetch(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({
    'apikey'        : SUPABASE_KEY,
    'Authorization' : 'Bearer ' + SUPABASE_KEY,
    'Content-Type'  : 'application/json'
  }, opts.headers || {});
  return fetch(SUPABASE_URL + path, opts);
}

/* ================================================================
   STATE SCREENS
   ================================================================ */
function showState(type, title, msg) {
  var iconMap = {
    error   : { svg: ICONS.alertCircle, cls: 'error-icon' },
    success : { svg: ICONS.checkCircle, cls: 'success-icon' },
    info    : { svg: ICONS.alertTriangle, cls: '' }
  };
  var cfg = iconMap[type] || iconMap.info;
  document.getElementById('page-content').innerHTML =
    '<div class="state-card">' +
      '<div class="state-icon ' + cfg.cls + '">' + cfg.svg + '</div>' +
      '<div class="state-title">' + title + '</div>' +
      '<div class="state-msg">' + msg + '</div>' +
    '</div>';
}

   RENDER THE FORM
   ================================================================ */

    special_meeting      : 'Special Meeting',
    emergency_meeting    : 'Emergency Meeting'
  };
  var typeLabel = typeMap[meeting.meeting_type] || meeting.meeting_type || 'Meeting';
  var agenda    = Array.isArray(meeting.agenda) ? meeting.agenda : [];

  var infoItems = [
    { icon: ICONS.clipboard, label: 'Meeting',  value: safe(meeting.title) },
    { icon: ICONS.tag,       label: 'Type',     value: typeLabel },
    { icon: ICONS.calendar,  label: 'Date',     value: fmtDate(meeting.meeting_date) },
    { icon: ICONS.clock,     label: 'Time',
      value: fmtTime(meeting.start_time) +
             (meeting.end_time ? ' &ndash; ' + fmtTime(meeting.end_time) : '') },
    { icon: ICONS.mapPin,    label: 'Venue',    value: safe(meeting.venue) },
    { icon: ICONS.hash,      label: 'Group',    value: 'Group ' + safe(meeting.group_number || '1') }
  ];

  var html = '';

  /* Info Card */
  html += '<div class="info-card"><div class="info-grid">';
  infoItems.forEach(function(item) {
    html +=
      '<div class="info-item">' +
        '<div class="info-icon">' + item.icon + '</div>' +
        '<div>' +
          '<div class="info-label">' + item.label + '</div>' +
          '<div class="info-value">' + item.value + '</div>' +
        '</div>' +
      '</div>';
  });
  html += '</div></div>';

  /* Agenda */
  if (agenda.length > 0) {
    html += '<div class="agenda-strip">';
    html += '<div class="agenda-header">' + ICONS.list + '<span>Agenda</span></div>';
    html += '<ol>';
    agenda.forEach(function(item) {
      html += '<li>' + safe(item.text || item) + '</li>';
    });
    html += '</ol></div>';
  }

  /* Form */
  html +=
    '<div class="form-card">' +
      '<div class="form-title">' + ICONS.edit + 'Mark Your Attendance</div>' +
      '<form id="att-form" novalidate>' +

        /* Name */
        '<div class="field-group">' +
          '<label class="field-label" for="f-name">' +
            ICONS.user + 'Full Name <span class="req">*</span>' +
          '</label>' +
          '<input type="text" id="f-name" class="field-input" ' +
                 'placeholder="Enter your full name" required />' +
        '</div>' +

        /* RI ID + In Time */
        '<div class="two-col">' +
          '<div class="field-group">' +
            '<label class="field-label" for="f-riid">' +
              ICONS.hash + 'RI ID' +
            '</label>' +
            '<input type="text" id="f-riid" class="field-input" ' +
                   'placeholder="RAC/24-25/001" />' +
          '</div>' +
          '<div class="field-group">' +
            '<label class="field-label" for="f-time">' +
              ICONS.clock + 'In Time <span class="req">*</span>' +
            '</label>' +
            '<input type="time" id="f-time" class="field-input" required />' +
          '</div>' +
        '</div>' +

        /* Designation */
        '<div class="field-group">' +
          '<label class="field-label" for="f-desig">' +
            ICONS.badge + 'Designation / Role' +
          '</label>' +
          '<input type="text" id="f-desig" class="field-input" ' +
                 'placeholder="President, Secretary, Member..." />' +
        '</div>' +

        /* Email */
        '<div class="field-group">' +
          '<label class="field-label" for="f-email">' +
            ICONS.mail + 'Email (optional)' +
          '</label>' +
          '<input type="email" id="f-email" class="field-input" ' +
                 'placeholder="you@example.com" />' +
        '</div>' +

        /* E-Signature */
        '<div class="sign-section">' +
          '<label class="field-label">' +
            ICONS.pen +
            'Electronic Signature <span class="req">*</span>' +
          '</label>' +
          '<div class="sign-wrap" id="sign-wrap">' +
            '<canvas id="sign-pad" class="sign-canvas"></canvas>' +
            '<div class="sign-placeholder" id="sign-placeholder">' +
              ICONS.pen + 'Sign here with mouse or finger' +
            '</div>' +
          '</div>' +
          '<div class="sign-actions">' +
            '<button type="button" class="btn-clear" onclick="clearPad()">' +
              ICONS.undo + 'Clear' +
            '</button>' +
          '</div>' +
        '</div>' +

        /* Submit */
        '<button type="submit" class="btn-submit" id="f-submit">' +
          ICONS.send + 'Submit Attendance' +
        '</button>' +

        /* Alerts */
        '<div class="alert alert-error" id="f-error"></div>' +
        '<div class="alert alert-success" id="f-success"></div>' +

      '</form>' +
    '</div>';

  /* Footer */
  html +=
    '<div class="footer">' +
      ICONS.shield +
      'Rotaract Club of Dr. N.G.P Arts &amp; Science College' +
    '</div>';

  document.getElementById('page-content').innerHTML = html;

  initSignaturePad();
  initFormSubmit(meeting);

  /* Auto-fill current time */
  var now  = new Date();
  var hh   = String(now.getHours()).padStart(2, '0');
  var mm   = String(now.getMinutes()).padStart(2, '0');
  var tInp = document.getElementById('f-time');
  if (tInp && !tInp.value) tInp.value = hh + ':' + mm;
}

/* ================================================================
   SIGNATURE PAD
   ================================================================ */
var _hasSigned = false;

function initSignaturePad() {
  var canvas  = document.getElementById('sign-pad');
  var wrap    = document.getElementById('sign-wrap');
  var ph      = document.getElementById('sign-placeholder');
  if (!canvas) return;
  var ctx     = canvas.getContext('2d');
  var drawing = false;

  function resize() {
    var rect = canvas.parentElement.getBoundingClientRect();
    var dpr  = window.devicePixelRatio || 1;
    canvas.width        = rect.width * dpr;
    canvas.height       = 140        * dpr;
    canvas.style.width  = rect.width + 'px';
    canvas.style.height = '140px';
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = '#1a2b4a';
    ctx.lineWidth   = 2.2;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
  }
  resize();
  window.addEventListener('resize', resize);

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return e.touches
      ? { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top }
      : { x: e.clientX - r.left,            y: e.clientY - r.top };
  }

  function start(e) {
    e.preventDefault(); drawing = true;
    wrap.classList.add('active');
    if (ph) ph.classList.add('hidden');
    var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
  }
  function move(e) {
    if (!drawing) return; e.preventDefault();
    var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
    _hasSigned = true;
  }
  function stop() { drawing = false; wrap.classList.remove('active'); }

  canvas.addEventListener('mousedown',  start);
  canvas.addEventListener('mousemove',  move);
  canvas.addEventListener('mouseup',    stop);
  canvas.addEventListener('mouseleave', stop);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove',  move,  { passive: false });
  canvas.addEventListener('touchend',   stop);
}

function clearPad() {
  var canvas = document.getElementById('sign-pad');
  var ph     = document.getElementById('sign-placeholder');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  _hasSigned = false;
  if (ph) ph.classList.remove('hidden');
}

function getSignatureBlob() {
  return new Promise(function(resolve) {
    if (!_hasSigned) { resolve(null); return; }
    document.getElementById('sign-pad')
      .toBlob(function(blob) { resolve(blob); }, 'image/png');
  });
}

/* ================================================================
   FORM SUBMISSION
   ================================================================ */
function initFormSubmit(meeting) {
  var form = document.getElementById('att-form');
  if (!form) return;

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    var errEl  = document.getElementById('f-error');
    var sucEl  = document.getElementById('f-success');
    var btn    = document.getElementById('f-submit');

    errEl.style.display = 'none';
    sucEl.style.display = 'none';

    var name  = document.getElementById('f-name').value.trim();
    var riId  = document.getElementById('f-riid').value.trim();
    var time  = document.getElementById('f-time').value;
    var desig = document.getElementById('f-desig').value.trim();
    var email = document.getElementById('f-email').value.trim();

    /* ── Validate ── */
    if (!name) {
      showAlert(errEl, ICONS.alertTriangle, 'Please enter your full name.');
      return;
    }
    if (!time) {
      showAlert(errEl, ICONS.alertTriangle, 'Please enter your in-time.');
      return;
    }
    if (!_hasSigned) {
      showAlert(errEl, ICONS.alertTriangle, 'Please provide your electronic signature.');
      return;
    }

    btn.disabled   = true;
    btn.innerHTML  = '<span class="spinner"></span> Submitting...';

    try {
      /* 1. Get signature blob */
      var signBlob = await getSignatureBlob();
      var eSignUrl = null;

      /* 2. Upload signature image to Supabase Storage */
      if (signBlob) {
        var sigName = 'esign_' + meeting.id + '_' + Date.now() + '.png';

        var uploadRes = await fetch(
          SUPABASE_URL + '/storage/v1/object/meetings/' + sigName,
          {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type' : 'image/png',
              'x-upsert'     : 'true'
            },
            body: signBlob
          }
        );

        if (uploadRes.ok) {
          eSignUrl = SUPABASE_URL +
            '/storage/v1/object/public/meetings/' + sigName;
        } else {
          /* Signature upload failed — log but continue */
          console.warn('Signature upload response:', uploadRes.status);
        }
      }

      /* 3. Insert attendance record via REST API */
      var insertRes = await sbFetch('/rest/v1/meeting_attendance', {
        method: 'POST',
        headers: {
          'apikey'        : SUPABASE_KEY,
          'Authorization' : 'Bearer ' + SUPABASE_KEY,
          'Content-Type'  : 'application/json',
          'Prefer'        : 'return=minimal'
        },
        body: JSON.stringify({
          meeting_id   : meeting.id,
          form_token   : TOKEN,
          member_name  : name,
          ri_id        : riId  || null,
          designation  : desig || null,
          member_email : email || null,
          in_time      : time,
          e_sign_url   : eSignUrl,
          submitted_at : new Date().toISOString()
        })
      });

      if (!insertRes.ok) {
        var body = {};
        try { body = await insertRes.json(); } catch (_) {}
        /* Duplicate entry */
        if (body.code === '23505') {
          throw new Error('You have already submitted attendance for this meeting.');
        }
        throw new Error(body.message || 'Submission failed. Please try again.');
      }

      /* 4. Success — hide form, show confirmation */
      showState('success', 'Attendance Recorded!',
        'Thank you, <strong>' + safe(name) + '</strong>. ' +
        'Your attendance has been successfully recorded.'
      );

    } catch (err) {
      showAlert(errEl, ICONS.xCircle, err.message || 'Something went wrong.');
      btn.disabled  = false;
      btn.innerHTML = ICONS.send + ' Submit Attendance';
    }
  });
}

function showAlert(el, iconSvg, msg) {
  el.innerHTML =
    '<div class="alert-icon">' + iconSvg + '<span>' + msg + '</span></div>';
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ================================================================
   INIT — Load meeting from Supabase, validate token, render form
   ================================================================ */
async function init() {

  /* Basic param validation */
  if (!MEETING_ID || !TOKEN) {
    showState('error', 'Invalid Link',
      'This attendance form link is invalid or has expired. ' +
      'Please contact the meeting organizer for a valid link.'
    );
    return;
  }

  try {
    /* Fetch meeting data */
    var res = await sbFetch(
      '/rest/v1/meetings' +
      '?id=eq.' + encodeURIComponent(MEETING_ID) +
      '&select=id,title,meeting_type,meeting_date,start_time,end_time,' +
      'venue,group_number,agenda,attendance_form_token',
      { method: 'GET' }
    );

    if (!res.ok) {
      throw new Error('Server returned ' + res.status);
    }

    var rows = await res.json();

    if (!rows || rows.length === 0) {
      showState('error', 'Meeting Not Found',
        'This meeting does not exist or has been removed.'
      );
      return;
    }

    var meeting = rows[0];

    /* Validate token */
    if (meeting.attendance_form_token !== TOKEN) {
      showState('error', 'Invalid Token',
        'This attendance form link is invalid. ' +
        'Please request a new link from the organizer.'
      );
      return;
    }

    /* Everything OK — render the form */
    renderForm(meeting);

  } catch (err) {
    console.error('Init error:', err);
    showState('error', 'Loading Failed',
      'Could not load the attendance form. ' +
      'Please check your internet connection and try again.'
    );
  }
}

/* Start */
init();
</script>
